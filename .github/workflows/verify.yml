name: Verify challenge build

on:
  push:
    branches: [main, webmcp-challenge-2026]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:check
      - run: npm run test:e2e:webmcp
      - run: npm run test:e2e -- tests/e2e/render-quality.spec.ts
      - run: npm run test:e2e:public
