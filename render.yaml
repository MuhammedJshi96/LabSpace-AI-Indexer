services:
  - type: web
    name: labspace-agent-twin
    runtime: node
    plan: 1c-2g
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: LABSPACE_PUBLIC_DEMO
        value: "1"
